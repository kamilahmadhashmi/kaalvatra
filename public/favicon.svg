<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="kvBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1812" />
      <stop offset="100%" stop-color="#0a0908" />
    </radialGradient>
    <linearGradient id="kvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d882" />
      <stop offset="50%" stop-color="#d4a838" />
      <stop offset="100%" stop-color="#9a721c" />
    </linearGradient>
    <linearGradient id="kvCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85240" />
      <stop offset="100%" stop-color="#992b1d" />
    </linearGradient>
  </defs>

  <!-- Outer Ring: Obsidian Disc with Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#kvBg)" stroke="url(#kvGold)" stroke-width="2" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(212,168,56,0.3)" stroke-width="0.75" stroke-dasharray="2 2" />

  <!-- 8 Astronomical Meridian Ticks (Chronometer of Time) -->
  <g stroke="url(#kvGold)" stroke-width="1.2" stroke-linecap="round">
    <line x1="32" y1="4" x2="32" y2="7.5" />
    <line x1="32" y1="56.5" x2="32" y2="60" />
    <line x1="4" y1="32" x2="7.5" y2="32" />
    <line x1="56.5" y1="32" x2="60" y2="32" />
    <line x1="12.2" y1="12.2" x2="14.7" y2="14.7" />
    <line x1="49.3" y1="49.3" x2="51.8" y2="51.8" />
    <line x1="51.8" y1="12.2" x2="49.3" y2="14.7" />
    <line x1="14.7" y1="49.3" x2="12.2" y2="51.8" />
  </g>

  <!-- Inner Crimson Core Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#kvCrimson)" stroke-width="1.2" />

  <!-- Bold Authoritative Monogram 'K' (KAALVATRA) with Serif Detailing -->
  <g fill="url(#kvGold)">
    <!-- Vertical Pillar -->
    <path d="M21 16 H26.5 V48 H21 Z" />
    <!-- Top Serif & Bottom Serif on Vertical Pillar -->
    <path d="M19 16 H28.5 V18 H19 Z" />
    <path d="M19 46 H28.5 V48 H19 Z" />
    <!-- Upper Diagonal Arm with Serif Finial -->
    <path d="M26.5 32.5 L39 18.5 H45.5 L31.5 33.8 Z" />
    <path d="M38 16.5 H46.5 V18.5 H38 Z" />
    <!-- Lower Diagonal Leg with Grounded Finial -->
    <path d="M29.2 31.2 L43 47.5 H36.5 L24.8 33.5 Z" />
    <path d="M36 46 H45.5 V48 H36 Z" />
  </g>

  <!-- Central Time Needle Star -->
  <circle cx="32" cy="32" r="1.75" fill="#f3d882" />
</svg>